name: Node CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  typecheck:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js v24
      uses: actions/setup-node@v3
      with:
        node-version: 24.x
    - name: Install dependencies
      run: npm ci
    - name: Type-check sources
      run: npm run typecheck

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js v24
      uses: actions/setup-node@v3
      with:
        node-version: 24.x
    - name: Install dependencies
      run: npm ci
    - name: Lint sources
      run: npm run lint

  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js v24
      uses: actions/setup-node@v3
      with:
        node-version: 24.x
    - name: Install dependencies
      run: npm ci
    - name: Run unit tests
      run: npm run test
